services:
  db:
    image: postgres:16-alpine
    container_name: thesis_db
    environment:
      POSTGRES_DB: thesis_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - thesis-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev 
    container_name: thesis_backend
    env_file:
      - ./backend/.env.docker
    depends_on:
      - db
    ports:
      - "4000:4000"
    networks:
      - thesis-net
    volumes:
      - ./backend:/app
      - backend_deps:/app/deps
      - backend_build:/app/_build
      - ./analysis:/analysis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev 
    container_name: thesis_frontend
    env_file:
      - ./frontend/.env.docker
    depends_on:
      - backend
    ports:
      - "3000:5173"
    networks:
      - thesis-net
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

networks:
  thesis-net:

volumes:
  db-data:
  backend_deps:
  backend_build:
  frontend_node_modules:
